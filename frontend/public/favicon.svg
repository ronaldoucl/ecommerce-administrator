<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Shopping bag">
  <!--
    Storefront mark: a shopping bag tinted with the brand indigo (#4F46E5, the
    theme's --color-primary). Hand-authored, so no icon toolchain or dependency
    is involved.
  -->
  <rect width="64" height="64" rx="14" fill="#4F46E5"/>
  <!-- Bag handle -->
  <path d="M24 23v-4a8 8 0 0 1 16 0v4"
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Bag body -->
  <path d="M16 23h32l-3 26a4 4 0 0 1-4 3.5H23a4 4 0 0 1-4-3.5z" fill="#FFFFFF"/>
  <!-- Fold detail, so the mark still reads at 16px -->
  <path d="M26 32h12" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
</svg>
